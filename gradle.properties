# Enable Gradle Daemon for faster builds
org.gradle.daemon=true
# Increase memory for the build process
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -Dkotlin.daemon.jvm.options="-Xmx2048m"
# Allow parallel project execution
org.gradle.parallel=true
# Enable caching and incremental builds
org.gradle.caching=true
org.gradle.vfs.watch=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
